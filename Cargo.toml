[package]
name = "pixlsnapz"
version = "0.1.1"
edition = "2024"
description = "Measure anything on your screen: a native macOS screen ruler"
license = "MIT OR Apache-2.0"
repository = "https://github.com/houseofmackee/pixlsnapz"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pixlsnapz"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
block2 = "0.6"
dirs = "7.0.0"
libc = "0.2.191"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-service-management = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[test]]
name = "settings_layout"
harness = false

[[test]]
name = "overlay_render"
harness = false
